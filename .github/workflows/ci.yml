name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: maven

      - name: Determine Test Profile
        id: profile
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "0 7 * * *" ]]; then
            echo "args=-Dgroups=positive" >> $GITHUB_OUTPUT
          else
            echo "args=" >> $GITHUB_OUTPUT
          fi

      - name: Run Tests
        id: run_tests
        continue-on-error: true
        env:
          YANDEX_DISK_TOKEN: ${{ secrets.YANDEX_DISK_TOKEN }}
        run: mvn clean test ${{ steps.profile.outputs.args }}

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Prepare Allure history
        if: always()
        run: |
          if [ -d "gh-pages/history" ] && [ "$(ls -A gh-pages/history 2>/dev/null)" ]; then
            mkdir -p target/allure-results/history
            cp -r gh-pages/history/* target/allure-results/history/
            echo "✅ History restored"
          else
            echo "⚠️ No previous history found"
          fi

      - name: Generate Allure Report with Maven
        if: always()
        run: |
          if [ ! -d "target/allure-results" ] || [ -z "$(ls -A target/allure-results 2>/dev/null)" ]; then
            echo "❌ No allure results found in target/allure-results"
            exit 1
          fi
          
          echo "📊 Generating Allure report with Maven..."
          mvn allure:report
          echo "✅ Report generated in target/site/allure-maven-plugin"

      - name: Prepare Multi-Report Structure
        if: always()
        run: |
          mkdir -p allure-history
          
          # Maven генерирует отчет в target/site/allure-maven-plugin
          ALLURE_REPORT_DIR="target/site/allure-maven-plugin"
          
          if [ ! -d "$ALLURE_REPORT_DIR" ]; then
            echo "❌ Allure report directory not found"
            exit 1
          fi
          
          # Копируем историю если она существует
          if [ -d "$ALLURE_REPORT_DIR/history" ]; then
            cp -r "$ALLURE_REPORT_DIR/history" allure-history/
          fi
          
          # Формируем папку latest
          mkdir -p allure-history/latest
          cp -r "$ALLURE_REPORT_DIR"/* allure-history/latest/
          
          # Создаем датированную папку
          REPORT_DATE=$(date +"%Y-%m-%d_%H-%M-%S")
          cp -r "$ALLURE_REPORT_DIR" "allure-history/$REPORT_DATE"
          
          # Очистка старых отчетов (оставляем 10)
          cd allure-history
          ls -t -d [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]_[0-9][0-9]-[0-9][0-9]-[0-9][0-9]/ 2>/dev/null | tail -n +11 | xargs -r rm -rf
          cd ..
          
          echo "✅ Multi-report structure prepared"

      - name: Publish Allure report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history