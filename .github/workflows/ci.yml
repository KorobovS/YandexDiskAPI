name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Determine Test Profile
        id: profile
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "${{ github.event.schedule }}" == "0 6 * * *" ]]; then
              echo "profile=all" >> $GITHUB_OUTPUT
            elif [[ "${{ github.event.schedule }}" == "0 7 * * *" ]]; then
              echo "profile=positive" >> $GITHUB_OUTPUT
            else
              echo "profile=all" >> $GITHUB_OUTPUT
            fi
          else
            echo "profile=all" >> $GITHUB_OUTPUT
          fi
          echo "✅ Selected profile: ${{ steps.profile.outputs.profile }}"

      - name: Run Tests
        id: run_tests
        continue-on-error: true
        env:
          YANDEX_DISK_TOKEN: ${{ secrets.YANDEX_DISK_TOKEN }}
        run: mvn clean test -P${{ steps.profile.outputs.profile }}

      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@v1
        with:
          allure_results: target/allure-results
          allure_report: allure-report
          keep_reports: 5

      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ steps.profile.outputs.profile }}-run-${{ github.run_number }}
          path: allure-report
          retention-days: 7

      - name: Fail job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: |
          echo "❌ Тесты не пройдены! Проверьте скачанный Allure-отчет."
          exit 1