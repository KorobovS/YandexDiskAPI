name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: maven

      - name: Determine Test Profile
        id: profile
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "0 7 * * *" ]]; then
            echo "args=-Dgroups=positive" >> $GITHUB_OUTPUT
          else
            echo "args=" >> $GITHUB_OUTPUT
          fi
          echo "✅ Selected args: ${{ steps.profile.outputs.args }}"

      - name: Run Tests
        id: run_tests
        continue-on-error: true
        env:
          YANDEX_DISK_TOKEN: ${{ secrets.YANDEX_DISK_TOKEN }}
        run: mvn clean test ${{ steps.profile.outputs.args }}

      - name: Debug Check allure-results location
        if: always()
        run: |
          echo "=== Checking target/allure-results ==="
          ls -la target/allure-results 2>/dev/null || echo "❌ target/allure-results не найден"
          
          echo "=== Searching for allure results ==="
          find . -name "*.json" -path "*/allure*" 2>/dev/null | head -20

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Setup Allure CLI
        if: always()
        run: |
          # Версия синхронизирована с pom.xml (2.29.1)
          ALLURE_VERSION=2.29.1
          wget -q https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/$ALLURE_VERSION/allure-commandline-$ALLURE_VERSION.tgz
          tar -zxvf allure-commandline-$ALLURE_VERSION.tgz
          echo "$(pwd)/allure-$ALLURE_VERSION/bin" >> $GITHUB_PATH

      - name: Prepare Allure history
        if: always()
        run: |
          # КЛЮЧЕВОЕ ИСПРАВЛЕНИЕ: Allure читает историю из папки history внутри директории с результатами
          if [ -d "gh-pages/history" ] && [ "$(ls -A gh-pages/history)" ]; then
            mkdir -p target/allure-results/history
            cp -r gh-pages/history/* target/allure-results/history/
            echo "✅ История успешно восстановлена в target/allure-results/history"
          else
            echo "⚠️ Предыдущая история не найдена, будет создан новый отчет без трендов"
          fi

      - name: Generate Allure Report
        if: always()
        run: |
          # Генерируем отчет. Allure автоматически подхватит историю из target/allure-results/history
          allure generate target/allure-results -c -o allure-report
          echo "✅ Allure report generated"

      - name: Prepare Multi-Report Structure
        if: always()
        run: |
          mkdir -p allure-history
          
          # Копируем обновленную историю для следующих запусков
          cp -r allure-report/history allure-history/
          
          # Формируем папку latest
          mkdir -p allure-history/latest
          cp -r allure-report/* allure-history/latest/
          
          # Создаем датированную папку
          REPORT_DATE=$(date +"%Y-%m-%d_%H-%M-%S")
          cp -r allure-report "allure-history/$REPORT_DATE"
          
          # Очистка старых отчетов (оставляем 10 самых новых, не трогая 'latest' и 'history')
          cd allure-history
          ls -t -d [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]_[0-9][0-9]-[0-9][0-9]-[0-9][0-9]/ 2>/dev/null | tail -n +11 | xargs -r rm -rf
          cd ..
          echo "✅ Multi-report structure prepared"

      - name: Publish Allure report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history