name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: maven

      - name: Determine Test Profile
        id: profile
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "0 7 * * *" ]]; then
            echo "args=-Dgroups=positive" >> $GITHUB_OUTPUT
          else
            echo "args=" >> $GITHUB_OUTPUT
          fi

      - name: Run Tests
        id: run_tests
        continue-on-error: true
        env:
          YANDEX_DISK_TOKEN: ${{ secrets.YANDEX_DISK_TOKEN }}
        run: mvn clean test ${{ steps.profile.outputs.args }}

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Setup Allure CLI
        if: always()
        run: |
          ALLURE_VERSION=2.29.1
          echo "📥 Downloading Allure $ALLURE_VERSION..."
          
          # Скачиваем с GitHub Releases (более надежно)
          wget -q https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz \
            || { echo "❌ Failed to download Allure"; exit 1; }
          
          tar -zxvf allure-${ALLURE_VERSION}.tgz
          echo "$(pwd)/allure-${ALLURE_VERSION}/bin" >> $GITHUB_PATH
          
          # Проверяем установку
          allure --version

      - name: Prepare Allure history
        if: always()
        run: |
          if [ -d "gh-pages/history" ] && [ "$(ls -A gh-pages/history 2>/dev/null)" ]; then
            mkdir -p target/allure-results/history
            cp -r gh-pages/history/* target/allure-results/history/
            echo "✅ History restored"
          else
            echo "⚠️ No previous history found"
          fi

      - name: Generate Allure Report
        if: always()
        run: |
          # Проверяем существование папки с результатами
          if [ ! -d "target/allure-results" ] || [ -z "$(ls -A target/allure-results 2>/dev/null)" ]; then
            echo "❌ No allure results found in target/allure-results"
            exit 1
          fi
          
          echo "📊 Generating Allure report..."
          allure generate target/allure-results -c -o allure-report
          echo "✅ Report generated"

      - name: Prepare Multi-Report Structure
        if: always()
        run: |
          mkdir -p allure-history
          
          # Копируем историю только если она существует
          if [ -d "allure-report/history" ]; then
            cp -r allure-report/history allure-history/
          fi
          
          # Формируем папку latest
          mkdir -p allure-history/latest
          cp -r allure-report/* allure-history/latest/
          
          # Создаем датированную папку
          REPORT_DATE=$(date +"%Y-%m-%d_%H-%M-%S")
          cp -r allure-report "allure-history/$REPORT_DATE"
          
          # Очистка старых отчетов
          cd allure-history
          ls -t -d [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]_[0-9][0-9]-[0-9][0-9]-[0-9][0-9]/ 2>/dev/null | tail -n +11 | xargs -r rm -rf
          cd ..
          
          echo "✅ Multi-report structure prepared"

      - name: Publish Allure report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history